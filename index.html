<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082B50">
<title>Remisiones Zavala</title>
<style>
:root {
  --navy:#082B50;
  --navy2:#123f6e;
  --cream:#f8f4ea;
  --line:#c8d2dc;
  --soft:#f4f7fa;
  --text:#10253b;
  --ok:#e9f5ee;
  --shadow:0 12px 32px rgba(8,43,80,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:#edf2f6;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:300px 1fr;
}
.sidebar{
  background:var(--navy);
  color:#fff;
  padding:18px 14px;
  min-height:100vh;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
}
.brand{
  background:#fff;
  border-radius:18px;
  padding:10px;
  margin-bottom:14px;
}
.brand img{width:100%;display:block;border-radius:12px}
.side-title{font-size:13px;opacity:.8;margin:10px 6px 8px}
.new-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 16px;
  background:#fff;
  color:var(--navy);
  font-weight:800;
  margin-bottom:12px;
}
.search{
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:white;
  outline:none;
}
.search::placeholder{color:rgba(255,255,255,.65)}
.notes-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note-chip{
  text-align:left;
  padding:11px 12px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:12px;
}
.note-chip.active{background:white;color:var(--navy)}
.note-chip .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-chip .meta{font-size:12px;opacity:.7;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.main{padding:18px 18px 80px}
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;
  margin:0 auto 12px;max-width:920px;
}
.toolbar .group{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:0;border-radius:12px;padding:11px 14px;font-weight:800;
  background:white;color:var(--navy);box-shadow:0 3px 10px rgba(8,43,80,.08);
}
.btn.primary{background:var(--navy);color:white}
.btn.danger{background:#fff1f1;color:#9d2b2b}
.status{font-size:13px;color:#607489}
.paper{
  max-width:920px;
  margin:auto;
  background:white;
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:24px;
}
.header{
  display:grid;
  grid-template-columns:minmax(250px,1fr) minmax(260px,.9fr);
  gap:26px;
  align-items:start;
}
.logo-wrap img{width:250px;max-width:100%;display:block}
.fields{display:grid;gap:18px;padding-top:18px}
.fieldline{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:end}
.fieldline label{font-family:Georgia,serif;font-weight:800;color:var(--navy);font-size:18px}
.fieldline input{
  border:0;border-bottom:1.5px solid var(--navy);padding:7px 4px;
  outline:none;color:var(--navy);background:transparent;font-weight:650;
}
.table-wrap{overflow:auto;margin-top:20px;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{
  background:var(--navy);color:white;padding:10px 8px;font-family:Georgia,serif;
  font-size:13px;letter-spacing:.04em;
}
tbody td{border:1px solid var(--line);padding:0}
tbody td:first-child{width:48px;text-align:center;font-weight:800;color:var(--navy);background:#fafcff}
.cell-input{
  width:100%;border:0;outline:none;padding:9px 8px;background:white;color:var(--text);
}
.qty{text-align:center}
.price,.total{text-align:right}
.total{font-weight:800;color:var(--navy);background:#fbfcfe}
.total-box{
  display:grid;grid-template-columns:1fr 220px;margin-top:12px;border:1.5px solid var(--navy);
  border-radius:12px;overflow:hidden;font-family:Georgia,serif;color:var(--navy);
}
.total-box .label{padding:14px 16px;font-weight:800;font-size:18px}
.total-box .amount{padding:14px 16px;border-left:1.5px solid var(--navy);font-weight:900;text-align:center;font-size:22px}
.quickbar{
  max-width:920px;margin:12px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap
}
.pill{
  background:#fff;border:1px solid #d8e0e7;border-radius:999px;padding:8px 11px;font-size:13px;color:#53687c
}
.empty{
  max-width:920px;margin:40px auto;background:white;padding:36px;border-radius:22px;
  text-align:center;box-shadow:var(--shadow)
}
.empty h2{color:var(--navy);margin-top:0}
.mobile-top{display:none}
@media(max-width:820px){
  .app{display:block}
  .sidebar{display:none}
  .mobile-top{
    display:flex;position:sticky;top:0;z-index:10;background:var(--navy);color:white;
    padding:10px 12px;gap:8px;align-items:center;justify-content:space-between;
  }
  .mobile-top select{max-width:55%;padding:9px;border-radius:10px;border:0}
  .main{padding:12px 10px 70px}
  .paper{padding:14px;border-radius:16px}
  .header{grid-template-columns:1fr;gap:6px}
  .logo-wrap{text-align:center}
  .logo-wrap img{margin:auto;width:230px}
  .fields{padding-top:0;gap:10px}
  .fieldline{grid-template-columns:72px 1fr}
  .fieldline label{font-size:15px}
  .toolbar{margin-bottom:8px}
  .toolbar .group{width:100%;display:grid;grid-template-columns:1fr 1fr}
  .toolbar .group .btn{width:100%}
  .total-box{grid-template-columns:1fr 150px}
  .total-box .label{font-size:15px}
}
@media print{
  @page{size:5.5in 8.5in;margin:.18in}
  body{background:white}
  .sidebar,.toolbar,.quickbar,.mobile-top{display:none!important}
  .app,.main{display:block;padding:0}
  .paper{
    box-shadow:none;border-radius:0;padding:0;max-width:none;width:100%;
  }
  .header{grid-template-columns:1fr .95fr;gap:12px}
  .logo-wrap img{width:185px}
  .fields{padding-top:5px;gap:8px}
  .fieldline label{font-size:11px}
  .fieldline input{font-size:9px;padding:3px}
  .table-wrap{margin-top:8px;border-radius:4px;overflow:visible}
  table{min-width:0}
  thead th{font-size:7.5px;padding:4px}
  .cell-input{font-size:7px;padding:3.2px}
  tbody td:first-child{font-size:7px}
  .total-box{margin-top:5px;grid-template-columns:1fr 135px;border-radius:5px}
  .total-box .label{padding:7px 8px;font-size:10px}
  .total-box .amount{padding:7px 8px;font-size:11px}
}
</style>
</head>

          </div>
          <div class="fields">
            <div class="fieldline">
              <label>FECHA:</label>
              <input id="dateInput" type="date">
            </div>
            <div class="fieldline">
              <label>CLIENTE:</label>
              <input id="clientInput" type="text" placeholder="Nombre del cliente">
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>No.</th><th>CANTIDAD</th><th>PRODUCTO</th><th>PRECIO</th><th>TOTAL</th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>

        <div class="total-box">
          <div class="label">TOTAL DE LA CUENTA:</div>
          <div class="amount" id="grandTotal">$0.00</div>
        </div>
      </section>

      <div class="quickbar">
        <span class="pill">Autoguardado local</span>
        <span class="pill">25 renglones por nota</span>
        <span class="pill">Cantidad × Precio automático</span>
        <span class="pill">Varias notas al mismo tiempo</span>
      </div>
    </div>
  </main>
</div>

<script>
const KEY="zavala_remisiones_v1";
let state = {notes:[], activeId:null};

function money(n){
  return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(Number(n||0));
}
function today(){
  const d=new Date(); const off=d.getTimezoneOffset(); const local=new Date(d.getTime()-off*60000);
  return local.toISOString().slice(0,10);
}
function blankItems(){ return Array.from({length:25},()=>({qty:"",product:"",price:""})); }
function load(){
  try{ state=JSON.parse(localStorage.getItem(KEY))||state; }catch(e){}
  if(!Array.isArray(state.notes)) state.notes=[];
  if(state.notes.length && !state.activeId) state.activeId=state.notes[0].id;
  render();
}
function persist(){
  localStorage.setItem(KEY,JSON.stringify(state));
  const s=document.getElementById("saveStatus");
  if(s){s.textContent="Guardado ✓"; setTimeout(()=>s.textContent="Guardado automáticamente",900);}
}
function createNote(copyFrom=null){
  const note={
    id:"n"+Date.now()+Math.random().toString(16).slice(2),
    date:copyFrom?.date||today(),
    client:copyFrom? copyFrom.client+" (copia)" : "",
    items:copyFrom? JSON.parse(JSON.stringify(copyFrom.items)) : blankItems(),
    createdAt:Date.now()
  };
  state.notes.unshift(note); state.activeId=note.id; persist(); render();
  setTimeout(()=>document.getElementById("clientInput")?.focus(),50);
}
function current(){return state.notes.find(n=>n.id===state.activeId);}
function selectNote(id){state.activeId=id;persist();render();}
function deleteCurrent(){
  const n=current(); if(!n)return;
  if(!confirm(`¿Eliminar la nota de "${n.client||"Sin nombre"}"?`)) return;
  state.notes=state.notes.filter(x=>x.id!==n.id);
  state.activeId=state.notes[0]?.id||null;
  persist(); render();
}
function duplicateNote(){const n=current(); if(n)createNote(n);}
function calcRow(item){
  const q=parseFloat(item.qty), p=parseFloat(item.price);
  return (!isNaN(q)&&!isNaN(p))?q*p:0;
}
function noteTotal(note){return note.items.reduce((s,it)=>s+calcRow(it),0);}

function renderList(filter=""){
  const list=document.getElementById("notesList");
  const sel=document.getElementById("mobileSelect");
  list.innerHTML=""; sel.innerHTML="";
  state.notes.filter(n=>(n.client||"").toLowerCase().includes(filter.toLowerCase())).forEach((n,idx)=>{
    const b=document.createElement("button");
    b.className="note-chip"+(n.id===state.activeId?" active":"");
    b.onclick=()=>selectNote(n.id);
    b.innerHTML=`<div class="name">${n.client||"Cliente sin nombre"}</div>
      <div class="meta"><span>${n.date||""}</span><span>${money(noteTotal(n))}</span></div>`;
    list.appendChild(b);
  });
  state.notes.forEach((n,i)=>{
    const o=document.createElement("option"); o.value=n.id;
    o.textContent=`${i+1} · ${n.client||"Sin nombre"} · ${money(noteTotal(n))}`;
    if(n.id===state.activeId)o.selected=true; sel.appendChild(o);
  });
}
function render(){
  const n=current();
  document.getElementById("emptyState").hidden=!!n;
  document.getElementById("workspace").hidden=!n;
  renderList(document.getElementById("searchNotes")?.value||"");
  if(!n)return;

  document.getElementById("dateInput").value=n.date||"";
  document.getElementById("clientInput").value=n.client||"";
  const body=document.getElementById("itemsBody");
  body.innerHTML="";
  n.items.forEach((it,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${i+1}</td>
      <td><input class="cell-input qty" inputmode="decimal" value="${escapeHtml(it.qty)}" data-k="qty" data-i="${i}"></td>
      <td><input class="cell-input" value="${escapeHtml(it.product)}" data-k="product" data-i="${i}"></td>
      <td><input class="cell-input price" inputmode="decimal" value="${escapeHtml(it.price)}" data-k="price" data-i="${i}"></td>
      <td class="cell-input total" id="rowTotal${i}">${money(calcRow(it))}</td>`;
    body.appendChild(tr);
  });
  document.getElementById("grandTotal").textContent=money(noteTotal(n));
  document.getElementById("noteCounter").textContent=`${state.notes.length} nota${state.notes.length===1?"":"s"} abierta${state.notes.length===1?"":"s"}`;
  bindInputs();
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function bindInputs(){
  document.getElementById("dateInput").oninput=e=>{current().date=e.target.value;persist();renderList(document.getElementById("searchNotes").value||"");};
  document.getElementById("clientInput").oninput=e=>{current().client=e.target.value;persist();renderList(document.getElementById("searchNotes").value||"");};
  document.querySelectorAll(".cell-input[data-i]").forEach(inp=>{
    inp.oninput=e=>{
      const i=+e.target.dataset.i,k=e.target.dataset.k;
      current().items[i][k]=e.target.value;
      document.getElementById("rowTotal"+i).textContent=money(calcRow(current().items[i]));
      document.getElementById("grandTotal").textContent=money(noteTotal(current()));
      persist(); renderList(document.getElementById("searchNotes").value||"");
    };
    inp.onkeydown=e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        const inputs=[...document.querySelectorAll(".cell-input[data-i]")];
        const idx=inputs.indexOf(e.target);
        inputs[Math.min(idx+1,inputs.length-1)]?.focus();
      }
    };
  });
}
document.getElementById("newNote").onclick=()=>createNote();
document.getElementById("mobileNew").onclick=()=>createNote();
document.getElementById("searchNotes").oninput=e=>renderList(e.target.value);
document.getElementById("mobileSelect").onchange=e=>selectNote(e.target.value);
load();
if(!state.notes.length) createNote();
</script>
</body>
</html>
