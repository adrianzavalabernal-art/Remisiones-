<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b22">
<title>Remisiones Zavala</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#e8ebe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.toolbar{
 position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;
 border-bottom:1px solid #d9dfd7
}
button{border:0;border-radius:12px;padding:10px 5px;background:#fff;color:#173b22;font-weight:800;box-shadow:0 1px 6px #0002}
button.primary{background:#173b22;color:#fff}
button.danger{color:#a92828}
.viewer{padding:8px 3px 28px;display:flex;justify-content:center}
.sheet{
 position:relative;width:min(100%,760px);aspect-ratio:1024/1536;
 background:#fff;box-shadow:0 10px 28px #0002;overflow:hidden
}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.edit{position:absolute;border:0;outline:0;background:transparent;color:#173b22;font-family:Arial,sans-serif}
.edit:focus{background:rgba(255,245,218,.65);box-shadow:inset 0 0 0 1px #c48b2d55}
.date{left:59.4%;top:10.65%;width:15.4%;height:2.4%;font-size:clamp(7px,1.3vw,13px);text-align:center}
.folio{left:59.4%;top:14.6%;width:15.4%;height:2.4%;font-size:clamp(7px,1.3vw,13px);text-align:center}
.client{left:59.4%;top:18.55%;width:15.4%;height:2.4%;font-size:clamp(7px,1.3vw,13px);text-align:left}
.date-native{
 position:absolute;
 left:43.7%;
 top:9.85%;
 width:32%;
 height:3.5%;
 opacity:.001;
 z-index:7;
 border:0;
 padding:0;
 background:transparent;
}
.date-hit{
 position:absolute;
 left:43.7%;
 top:9.85%;
 width:32%;
 height:3.5%;
 z-index:6;
 pointer-events:none
}

.cell{height:2.34%;font-size:clamp(7px,1.18vw,12px);padding:0 .45%;font-weight:400}
.qty{left:8.0%;width:13.9%;text-align:center}
.product{left:22.0%;width:35.7%;text-align:left}
.price{left:57.9%;width:20.7%;text-align:right}
.total{left:78.7%;width:17.4%;text-align:right;display:flex;align-items:center;justify-content:flex-end;padding-right:.7%}
.grand{left:61.9%;top:88.2%;width:31.0%;height:4.6%;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.4vw,34px);font-weight:600;color:#173b22}

.modal{display:none;position:fixed;inset:0;z-index:100;background:#10201866;padding:70px 12px}
.modal.open{display:block}
.panel{max-width:500px;margin:auto;background:white;border-radius:16px;overflow:hidden}
.panel input{width:100%;padding:12px;border:0;border-bottom:1px solid #ddd;font-size:16px;outline:0}
.results{max-height:60vh;overflow:auto}
.result{display:block;width:100%;text-align:left;border-radius:0;box-shadow:none;border-bottom:1px solid #eee;padding:12px}
.result strong{display:block}
.result small{color:#687468}
.close{width:100%;border-radius:0;box-shadow:none}





.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#173b22;color:#fff;padding:8px 13px;border-radius:999px;opacity:0;z-index:210}
.toast.show{opacity:1}

@media(max-width:480px){
 .edit, .client{
   font-size:16px !important;
 }
 .cell{
   font-size:11px !important;
 }
 input.edit:not(.cell){
   font-size:16px !important;
 }

 .toolbar{gap:6px;padding:8px 5px}
 button{font-size:11px;padding:9px 2px}
 .viewer{padding:5px 1px 20px}
}
@media print{
 @page{
   size:5.5in 8.5in;
   margin:0;
 }
 html,body{
   width:5.5in;
   height:8.5in;
   margin:0!important;
   padding:0!important;
   background:white!important;
   overflow:hidden!important;
   -webkit-print-color-adjust:exact;
   print-color-adjust:exact;
 }
 .toolbar,.modal,.toast{display:none!important}
 .viewer{
   width:5.5in;
   height:8.5in;
   margin:0!important;
   padding:0!important;
   display:block!important;
 }
 .sheet{
   width:5.5in!important;
   height:8.5in!important;
   max-width:none!important;
   margin:0!important;
   box-shadow:none!important;
   overflow:hidden!important;
   break-inside:avoid;
   page-break-inside:avoid;
 }
 .bg{
   display:none!important;
 }
 .sheet{
   background:transparent!important;
 }
}
</style>
</head>

  <div class="date-hit" id="dateHit"></div>
  <input id="dateNative" class="date-native" type="date">
  <div id="dateText" class="edit date"></div>
  <div id="folioText" class="edit folio"></div>
  <input id="client" class="edit client" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="next">

  <div id="rows"></div>
  <div id="grand" class="edit grand">$0.00</div>
 </div>
</div>

<div class="modal" id="searchModal">
 <div class="panel">
  <input id="searchInput" placeholder="Buscar por cliente o folio">
  <div class="results" id="results"></div>
  <button class="close" id="closeSearch">Cerrar</button>
 </div>
</div>

<div class="toast" id="toast">Guardado</div>

<script>
const KEY="zavala_exact_sheet_v13";
let app={notes:[],active:null,nextFolio:1};
const $=s=>document.querySelector(s);
function money(v){return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(Number(v||0))}
function todayISO(){
 const d=new Date(),o=d.getTimezoneOffset();
 return new Date(d.getTime()-o*60000).toISOString().slice(0,10)
}
function blankRows(){return Array.from({length:25},()=>({q:"",p:"",price:""}))}
function folio(n){return String(n).padStart(7,"0")}
function current(){return app.notes.find(n=>n.id===app.active)}
function rowTotal(r){
 const q=parseFloat(String(r.q).replace(",","."));
 const p=parseFloat(String(r.price).replace(/[^0-9.,-]/g,"").replace(",","."));
 return !isNaN(q)&&!isNaN(p)?q*p:0
}
function noteTotal(n){return n.rows.reduce((s,r)=>s+rowTotal(r),0)}
function showDate(iso){
 if(!iso){$("#dateText").textContent="";return}
 const [y,m,d]=iso.split("-");
 $("#dateText").textContent=`${d}/${m}/${String(y).slice(-2)}`
}
function save(show=false){localStorage.setItem(KEY,JSON.stringify(app));if(show)toast()}
function newNote(renderNow=true){
 const n={id:"n"+Date.now()+Math.random().toString(16).slice(2),date:todayISO(),folio:app.nextFolio++,client:"",rows:blankRows(),created:Date.now()};
 app.notes.unshift(n);app.active=n.id;save();if(renderNow){render();setTimeout(()=>$("#client").focus(),50)}
}
function load(){
 try{app=JSON.parse(localStorage.getItem(KEY))||app}catch(e){}
 if(!Array.isArray(app.notes))app.notes=[];
 app.nextFolio=Number(app.nextFolio);
 if(!Number.isFinite(app.nextFolio)||app.nextFolio<1)app.nextFolio=Math.max(0,...app.notes.map(n=>Number(n.folio)||0))+1;
 if(!app.notes.length)newNote(false);
 if(!app.active)app.active=app.notes[0].id;
 render()
}
function removeNote(){
 if(!confirm("¿Eliminar esta nota?"))return;
 app.notes=app.notes.filter(n=>n.id!==app.active);app.active=app.notes[0]?.id||null;
 if(!app.notes.length)newNote(false);save();render()
}
function render(){
 const n=current();if(!n)return;
 if(!Array.isArray(n.rows)) n.rows=blankRows();
 while(n.rows.length<25) n.rows.push({q:"",p:"",price:""});
 if(n.rows.length>25) n.rows=n.rows.slice(0,25);
 $("#dateNative").value=n.date||"";showDate(n.date);
 $("#folioText").textContent=folio(n.folio||0);
 $("#client").value=n.client||"";
 const box=$("#rows");box.innerHTML="";
 for(let i=0;i<25;i++){
  const top=26.35+i*2.34,r=n.rows[i];
  box.append(makeInput("qty",top,r.q,i,"q"),makeInput("product",top,r.p,i,"p"),makeInput("price",top,r.price,i,"price"));
  const t=document.createElement("div");t.className="edit cell total";t.style.top=top+"%";t.id="t"+i;t.textContent=rowTotal(r)?money(rowTotal(r)):"";box.appendChild(t)
 }
 $("#grand").textContent=money(noteTotal(n))
}
function makeInput(cls,top,val,i,key){
 const el=document.createElement("input");el.className="edit cell "+cls;el.style.top=top+"%";el.dataset.row=i;el.dataset.key=key;el.type="text";
 el.value=val||"";el.inputMode=(key==="q"||key==="price")?"decimal":"text";el.autocomplete="off";el.setAttribute("enterkeyhint","next");
 if(key==="price"&&el.value!==""){const n=parseFloat(el.value);if(!isNaN(n))el.value=money(n)}
 el.onfocus=()=>{if(key==="price")el.value=String(current().rows[i][key]||"")};
 el.oninput=()=>{current().rows[i][key]=el.value;$("#t"+i).textContent=rowTotal(current().rows[i])?money(rowTotal(current().rows[i])):"";$("#grand").textContent=money(noteTotal(current()));save()};
 el.onchange=()=>{if(key==="price"){const n=parseFloat(String(el.value).replace(/[^0-9.,-]/g,"").replace(",","."));if(!isNaN(n)){current().rows[i][key]=String(n);el.value=money(n)}}save(true)};
 el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();nextField(i,key)}};
 return el
}
function nextField(i,key){
 let r=i,k;if(key==="q")k="p";else if(key==="p")k="price";else{r=i+1;k="q"}
 if(r>=25){document.activeElement?.blur();return}
 document.querySelector(`input[data-row="${r}"][data-key="${k}"]`)?.focus()
}
function prevField(i,key){
 let r=i,k;
 if(key==="price")k="p";
 else if(key==="p")k="q";
 else{
   r=i-1;
   k="price";
 }
 if(r<0){
   document.getElementById("client")?.focus();
   return;
 }
 document.querySelector(`input[data-row="${r}"][data-key="${k}"]`)?.focus()
}
function searchRender(q){
 const box=$("#results");box.innerHTML="";
 const s=q.toLowerCase();
 app.notes.filter(n=>(n.client||"").toLowerCase().includes(s)||folio(n.folio).includes(s)).forEach(n=>{
  const b=document.createElement("button");b.className="result";b.innerHTML=`<strong>${n.client||"Cliente sin nombre"}</strong><small>Folio ${folio(n.folio)} · ${money(noteTotal(n))}</small>`;
  b.onclick=()=>{app.active=n.id;save();render();$("#searchModal").classList.remove("open")};box.appendChild(b)
 })
}
function toast(){$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),700)}

$("#dateNative").oninput=e=>{current().date=e.target.value;showDate(e.target.value);save()};
$("#client").oninput=e=>{current().client=e.target.value;save()};
$("#client").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.querySelector('input[data-row="0"][data-key="q"]')?.focus()}};
$("#newBtn").onclick=()=>newNote(true);
$("#deleteBtn").onclick=removeNote;
$("#printBtn").onclick=()=>window.print();
$("#searchBtn").onclick=()=>{$("#searchModal").classList.add("open");$("#searchInput").value="";searchRender("");setTimeout(()=>$("#searchInput").focus(),50)};
$("#searchInput").oninput=e=>searchRender(e.target.value);
$("#closeSearch").onclick=()=>$("#searchModal").classList.remove("open");
load();
</script>
</body>
</html>
