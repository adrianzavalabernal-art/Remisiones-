<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173515">
<title>Ticket de Venta Zavala</title>
<style>
:root{
  --green:#173515;
  --green2:#21441d;
  --gold:#c4933b;
  --paper:#f8f0e3;
  --line:#e5d6bf;
  --ink:#1f281d;
  --red:#b3261e;
  --ui:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:#ecefe9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.appbar{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid #dce2d8;padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));
}
.appbar-inner{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.appbar button,.action-row button,.keypad button,.keyboard-tools button{
  border:0;border-radius:11px;background:#fff;color:var(--green);font-weight:800;box-shadow:0 1px 7px rgba(23,53,21,.12);
}
.appbar button{padding:10px 5px;font-size:12px}
.appbar .primary,.action-row .primary{background:var(--green);color:#fff}
.appbar .danger,.action-row .danger{color:var(--red)}

.stage{padding:10px 4px 220px;display:flex;justify-content:center}
.ticket{
  width:min(100%,760px);
  aspect-ratio:5.5/8.5;
  background:var(--paper);
  border:1px solid #d6bd96;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(23,53,21,.13);
  display:grid;
  grid-template-rows:22.5% 61.5% 11.5% 4.5%;
}
.ticket-header{
  padding:2.2% 3% 1.2%;
  display:grid;
  grid-template-columns:36% 64%;
  gap:1.5%;
  min-height:0;
}
.brand{display:flex;align-items:center;justify-content:center;min-height:0}
.brand img{width:94%;height:95%;object-fit:contain;display:block}
.right-head{display:flex;flex-direction:column;min-height:0}
.title{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--green);font-weight:700;text-align:center;
  font-size:clamp(21px,4.3vw,43px);line-height:1;margin-top:1%;
}
.ornament{display:flex;align-items:center;gap:10px;margin:1% 10% 2%}
.ornament:before,.ornament:after{content:"";height:1px;background:var(--gold);flex:1}
.ornament span{color:var(--gold);font-size:clamp(15px,2vw,23px)}
.meta{display:grid;grid-template-rows:repeat(3,1fr);gap:2%;min-height:0}
.meta-row{
  display:grid;grid-template-columns:7% 18% 1fr;gap:2%;align-items:center;
  min-height:0;
}
.meta-icon{width:100%;max-width:22px;color:var(--green)}
.meta-label{font-size:clamp(8px,1.45vw,14px);font-weight:600;white-space:nowrap}
.meta-input,.meta-value{
  height:78%;min-height:22px;width:100%;border:1px solid #d9ba86;border-radius:6px;
  background:rgba(255,255,255,.28);padding:0 7px;color:#222;
  font-size:clamp(8px,1.4vw,14px);font-weight:500;outline:none;
}
.meta-value{display:flex;align-items:center}
.date-row{cursor:pointer}
.date-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.grid-zone{padding:0 2.8%;min-height:0;height:100%}
.grid-wrap{height:100%;border:1px solid var(--gold);border-radius:11px 11px 0 0;overflow:hidden;background:rgba(255,255,255,.12)}
.grid-wrap table{height:100%}
table{width:100%;height:100%;table-layout:fixed;border-collapse:collapse}
thead{height:6.4%}
tbody{height:93.6%}
tbody tr{height:3.744% !important}
thead th{
  background:var(--green);color:#fff;font-weight:700;
  font-size:clamp(7px,1.25vw,12px);padding:0 4px;white-space:nowrap;
}
thead th:nth-child(1){width:18%}
thead th:nth-child(2){width:39%}
thead th:nth-child(3){width:22%}
thead th:nth-child(4){width:21%}
tbody tr{height:4%}
tbody td{border-bottom:1px solid var(--line);padding:0;position:relative}
.rownum{
  position:absolute;left:2px;top:50%;transform:translateY(-50%);
  width:17px;text-align:center;font-size:clamp(6px,1.05vw,10px);color:#111
}
.cell-input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  padding:0 8px;font-size:clamp(7px,1.18vw,12px);color:#222
}
.qty{text-align:center;padding-left:24px}
.product{text-align:left}
.price{text-align:right;padding-left:22px}
.currency{
  position:absolute;left:7px;top:50%;transform:translateY(-50%);
  font-size:clamp(7px,1.12vw,11px);color:#111
}
.total{
  text-align:right;padding:0 9px 0 22px;font-size:clamp(7px,1.18vw,12px);color:#222;
  display:flex;align-items:center;justify-content:flex-end;height:100%
}
.cell-input:focus{background:rgba(248,229,196,.55)}

.ticket-footer{
  padding:1.3% 3%;display:grid;grid-template-columns:1fr 42%;gap:2.5%;align-items:center;
  border-top:1px solid #d4bd98;
}
.thanks{font-family:Georgia,"Times New Roman",serif;color:var(--green);padding-left:2%}
.thanks-main{font-style:italic;font-size:clamp(19px,3.8vw,38px);line-height:.9}
.thanks-sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--gold);font-weight:800;letter-spacing:.06em;font-size:clamp(8px,1.4vw,14px)}
.total-box{border:1.4px solid var(--gold);border-radius:11px;text-align:center;padding:5% 4%;background:rgba(255,255,255,.22)}
.total-title{color:var(--gold);font-weight:800;font-size:clamp(9px,1.55vw,15px)}
.total-value{color:var(--green);font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,4vw,40px);font-weight:700;line-height:1;margin-top:2%}
.bottom-strip{background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(7px,1.1vw,11px);letter-spacing:.07em}

.action-row{
  max-width:760px;margin:10px auto 0;display:grid;grid-template-columns:1.15fr 1fr 1.25fr 1fr 1.2fr;gap:7px;
  padding:0 4px
}
.action-row button{padding:10px 5px;font-size:11px}
.action-row .hide{background:var(--green);color:#fff}

.keypad-shell{
  position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(246,243,237,.98);
  border-top:1px solid #d5d8d0;box-shadow:0 -8px 25px rgba(23,53,21,.13);
  padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  display:none;
}
.keypad-shell.show{display:block}
.keypad{
  max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr .82fr .82fr .82fr;gap:7px;
  grid-auto-rows:54px;
}
.keypad button{font-size:18px;font-weight:600}
.keypad .small{font-size:14px}
.keypad .enter{grid-row:span 2;background:#dbe5d7;color:var(--green);font-size:15px}
.keypad .next{grid-column:5/7;background:var(--gold);color:white;font-size:14px}
.keypad .back{background:#e5e7e4}
.keypad .dangerkey{color:#7e261f}

.keyboard-tools{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:200;display:none;gap:8px;padding:7px;border-radius:14px;background:#fff;box-shadow:0 8px 28px rgba(23,53,21,.2)
}
.keyboard-tools.show{display:flex}
.keyboard-tools button{padding:10px 14px}
.keyboard-tools .nexttext{background:var(--green);color:white;font-size:22px;min-width:65px}

.modal{position:fixed;inset:0;z-index:300;background:rgba(8,18,9,.38);display:none;padding:70px 12px 20px}
.modal.open{display:block}
.panel{max-width:520px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.25)}
.panel-head{padding:12px;border-bottom:1px solid #e2e7df}
.panel-head input{width:100%;border:1px solid #ccd7c8;border-radius:12px;padding:11px 12px;font-size:16px}
.results{max-height:60vh;overflow:auto}
.result{width:100%;box-shadow:none;border-radius:0;border-bottom:1px solid #edf1eb;text-align:left;padding:13px 14px}
.result strong{display:block}
.result span{display:flex;justify-content:space-between;color:#6b7866;font-size:12px;margin-top:3px}
.close{width:100%;border-radius:0;box-shadow:none;border-top:1px solid #e4e9e1;padding:13px}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:400;background:var(--green);color:#fff;padding:8px 12px;border-radius:999px;opacity:0;transition:.2s}
.toast.show{opacity:1}


.alpha-shell{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:220;
  display:none;
  background:rgba(246,243,237,.985);
  border-top:1px solid #d5d8d0;
  box-shadow:0 -8px 25px rgba(23,53,21,.13);
  padding:8px max(7px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));
}
.alpha-shell.show{display:block}
.alpha-keyboard{
  max-width:760px;
  margin:auto;
  display:grid;
  gap:6px;
}
.alpha-row{
  display:grid;
  gap:5px;
}
.alpha-row.r1{grid-template-columns:repeat(10,1fr)}
.alpha-row.r2{grid-template-columns:repeat(9,1fr);padding:0 4%}
.alpha-row.r3{grid-template-columns:1.25fr repeat(7,1fr) 1.25fr}
.alpha-row.r4{grid-template-columns:1.2fr 4fr 1.3fr 1.5fr}
.alpha-keyboard button{
  min-height:44px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#1e281c;
  box-shadow:0 1px 5px rgba(23,53,21,.11);
  font-size:16px;
  font-weight:600;
  padding:6px 2px;
}
.alpha-keyboard .special{background:#e6e9e3}
.alpha-keyboard .nextalpha{background:var(--gold);color:#fff;font-weight:800}
.alpha-keyboard .hidealpha{background:var(--green);color:#fff;font-size:13px}

@media(max-width:560px){
  .appbar-inner{grid-template-columns:repeat(4,1fr)}
  .appbar button{font-size:11px;padding:9px 3px}
  .stage{padding:5px 2px 220px}
  .ticket{border-radius:8px}
  .ticket-header{padding-left:2.4%;padding-right:2.4%}
  .meta-row{grid-template-columns:8% 20% 1fr}
  .action-row{grid-template-columns:repeat(5,1fr);gap:5px}
  .action-row button{font-size:9.5px;padding:9px 2px}
  .keypad{grid-auto-rows:48px;gap:6px}
}

@media(max-width:560px){
  input, textarea, select, .cell-input, .meta-input{
    font-size:16px !important;
  }
}

@media print{
  @page{size:5.5in 8.5in;margin:0}
  html,body{background:#fff}
  .appbar,.action-row,.keypad-shell,.alpha-shell,.keyboard-tools,.modal,.toast{display:none!important}
  .stage{padding:0;display:block}
  .ticket{width:5.5in;height:8.5in;max-width:none;border:0;border-radius:0;box-shadow:none}
}
</style>
</head>

  <div class="alpha-keyboard">
    <div class="alpha-row r1">
      <button data-letter="Q">Q</button><button data-letter="W">W</button><button data-letter="E">E</button><button data-letter="R">R</button><button data-letter="T">T</button><button data-letter="Y">Y</button><button data-letter="U">U</button><button data-letter="I">I</button><button data-letter="O">O</button><button data-letter="P">P</button>
    </div>
    <div class="alpha-row r2">
      <button data-letter="A">A</button><button data-letter="S">S</button><button data-letter="D">D</button><button data-letter="F">F</button><button data-letter="G">G</button><button data-letter="H">H</button><button data-letter="J">J</button><button data-letter="K">K</button><button data-letter="L">L</button>
    </div>
    <div class="alpha-row r3">
      <button class="special" data-action-alpha="caps">⇧</button>
      <button data-letter="Z">Z</button><button data-letter="X">X</button><button data-letter="C">C</button><button data-letter="V">V</button><button data-letter="B">B</button><button data-letter="N">N</button><button data-letter="M">M</button>
      <button class="special" data-action-alpha="back">⌫</button>
    </div>
    <div class="alpha-row r4">
      <button class="hidealpha" data-action-alpha="hide">Ocultar</button>
      <button data-letter=" ">espacio</button>
      <button class="special" data-letter="-">-</button>
      <button class="nextalpha" data-action-alpha="next">› Siguiente</button>
    </div>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="panel">
    <div class="panel-head"><input id="searchInput" placeholder="Buscar por cliente..."></div>
    <div id="results" class="results"></div>
    <button class="close" id="closeSearch">Cerrar</button>
  </div>
</div>
<div class="toast" id="toast">Guardado</div>

<script>
const KEY="zavala_exact_v13";
let app={notes:[],active:null,nextFolio:1};
let activeNumeric=null;

const $=s=>document.querySelector(s);
function money(v){return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(Number(v||0))}
function nowISO(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,16)}
function blankRows(){return Array.from({length:25},()=>({q:"",p:"",price:""}))}
function folio(n){return String(n).padStart(7,"0")}
function current(){return app.notes.find(n=>n.id===app.active)}
function numericValue(v){return parseFloat(String(v).replace(/[^0-9.,-]/g,"").replace(",","."))}
function rowTotal(r){const q=numericValue(r.q),p=numericValue(r.price);return (!isNaN(q)&&!isNaN(p))?q*p:0}
function noteTotal(n){return n.rows.reduce((s,r)=>s+rowTotal(r),0)}

function showDate(iso){
  const e=$("#dateText");if(!iso){e.textContent="";return}
  const d=new Date(iso),dd=String(d.getDate()).padStart(2,"0"),mm=String(d.getMonth()+1).padStart(2,"0"),yy=String(d.getFullYear()).slice(-2);
  let h=d.getHours();const mi=String(d.getMinutes()).padStart(2,"0"),ap=h>=12?"p.m.":"a.m.";h=h%12||12;
  e.textContent=`${dd}/${mm}/${yy}  ${String(h).padStart(2,"0")}:${mi} ${ap}`;
}
function save(show=false){localStorage.setItem(KEY,JSON.stringify(app));if(show)toast()}
function load(){
  try{app=JSON.parse(localStorage.getItem(KEY))||app}catch(e){}
  if(!Array.isArray(app.notes))app.notes=[];
  if(!app.notes.length)newNote(false);
  if(!app.active)app.active=app.notes[0].id;
  if(!app.nextFolio)app.nextFolio=Math.max(1,...app.notes.map(n=>Number(n.folio)||0))+1;
  render();
}
function newNote(doRender=true){
  const n={id:"n"+Date.now()+Math.random().toString(16).slice(2),date:nowISO(),folio:app.nextFolio++,client:"",rows:blankRows(),created:Date.now()};
  app.notes.unshift(n);app.active=n.id;save();
  if(doRender){render();setTimeout(()=>$("#client").focus(),60)}
}
function deleteNote(){
  if(!confirm("¿Eliminar esta nota?"))return;
  app.notes=app.notes.filter(n=>n.id!==app.active);
  app.active=app.notes[0]?.id||null;
  if(!app.notes.length)newNote(false);
  save();render();
}

function render(){
  const n=current();
  if(!n)return;

  document.getElementById("date").value=n.date||"";
  showDate(n.date);
  document.getElementById("folioText").textContent=folio(n.folio||0);
  document.getElementById("client").value=n.client||"";

  // Guarantee exactly 25 editable rows in every note.
  if(!Array.isArray(n.rows)) n.rows=[];
  while(n.rows.length<25) n.rows.push({q:"",p:"",price:""});
  if(n.rows.length>25) n.rows=n.rows.slice(0,25);

  const body=document.getElementById("itemsBody");
  body.innerHTML="";

  for(let i=0;i<25;i++){
    const r=n.rows[i];

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>
        <span class="rownum">${i+1}</span>
        <input class="cell-input qty"
               data-row="${i}" data-key="q"
               inputmode="none"
               autocomplete="off"
               aria-label="Cantidad fila ${i+1}">
      </td>
      <td>
        <input class="cell-input product"
               data-row="${i}" data-key="p"
               inputmode="text"
               autocomplete="off"
               autocapitalize="sentences"
               enterkeyhint="next"
               aria-label="Producto fila ${i+1}">
      </td>
      <td>
        <span class="currency">$</span>
        <input class="cell-input price"
               data-row="${i}" data-key="price"
               inputmode="none"
               autocomplete="off"
               aria-label="Precio fila ${i+1}">
      </td>
      <td>
        <span class="currency">$</span>
        <div class="total" id="t${i}">0.00</div>
      </td>`;

    body.appendChild(tr);

    tr.querySelector('[data-key="q"]').value=r.q||"";
    tr.querySelector('[data-key="p"]').value=r.p||"";
    tr.querySelector('[data-key="price"]').value=r.price||"";

    const rt=rowTotal(r);
    document.getElementById("t"+i).textContent=rt ? rt.toFixed(2) : "0.00";
  }

  document.getElementById("grandTotal").textContent=money(noteTotal(n));
  bindCells();
  save();
}

function bindCells(){
  document.querySelectorAll('[data-key="q"],[data-key="price"]').forEach(el=>{
    el.addEventListener("focus",()=>openNumeric(el));
    el.addEventListener("click",()=>openNumeric(el));
  });
  document.querySelectorAll('[data-key="p"]').forEach(el=>{
    el.addEventListener("focus",()=>openAlpha(el));
    el.addEventListener("click",()=>openAlpha(el));
    el.addEventListener("input",()=>updateFromCell(el));
  });
}
function updateFromCell(el){
  const i=Number(el.dataset.row);
  const key=el.dataset.key;
  if(Number.isNaN(i) || i<0 || i>=25) return;

  current().rows[i][key]=el.value;

  const rt=rowTotal(current().rows[i]);
  const totalCell=document.getElementById("t"+i);
  if(totalCell) totalCell.textContent=rt ? rt.toFixed(2) : "0.00";

  document.getElementById("grandTotal").textContent=money(noteTotal(current()));
  save();
}
function openNumeric(el){
  activeNumeric=el;hideTextTools();$("#keypadShell").classList.add("show");
  setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),100);
}
function closeNumeric(){$("#keypadShell").classList.remove("show");activeNumeric?.blur();activeNumeric=null}
function insertKey(v){
  if(!activeNumeric)return;
  const start=activeNumeric.selectionStart??activeNumeric.value.length,end=activeNumeric.selectionEnd??start;
  activeNumeric.value=activeNumeric.value.slice(0,start)+v+activeNumeric.value.slice(end);
  const pos=start+v.length;activeNumeric.setSelectionRange(pos,pos);updateFromCell(activeNumeric);
}
function backspace(){
  if(!activeNumeric)return;
  let s=activeNumeric.selectionStart??activeNumeric.value.length,e=activeNumeric.selectionEnd??s;
  if(s===e&&s>0)s--;
  activeNumeric.value=activeNumeric.value.slice(0,s)+activeNumeric.value.slice(e);
  activeNumeric.setSelectionRange(s,s);updateFromCell(activeNumeric);
}
function clearField(){if(!activeNumeric)return;activeNumeric.value="";updateFromCell(activeNumeric)}
function moveCaret(dir){
  if(!activeNumeric)return;let p=activeNumeric.selectionStart??0;p=Math.max(0,Math.min(activeNumeric.value.length,p+dir));activeNumeric.setSelectionRange(p,p)
}
function nextField(el){
  const i=Number(el.dataset.row),key=el.dataset.key;
  let ni=i,nk;
  if(key==="q")nk="p";
  else if(key==="p")nk="price";
  else{ni=i+1;nk="q"}
  if(ni>=25){closeNumeric();hideTextTools();return}
  const next=document.querySelector(`[data-row="${ni}"][data-key="${nk}"]`);
  if(!next)return;
  if(nk==="p"){
    closeNumeric();
    next.focus();
    openAlpha(next);
  }else{
    closeAlpha();
    hideTextTools();
    next.focus();
    openNumeric(next);
  }
}

function showTextTools(el){activeNumeric=null;$("#keypadShell").classList.remove("show");$("#keyboardTools").classList.add("show");window._textActive=el}
function hideTextTools(){$("#keyboardTools").classList.remove("show");window._textActive=null}
function toast(){const t=$("#toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),700)}


let activeAlpha=null;
let alphaCaps=true;

function openAlpha(el){
  activeAlpha=el;
  activeNumeric=null;
  document.getElementById("keypadShell")?.classList.remove("show");
  document.getElementById("keyboardTools")?.classList.remove("show");
  document.getElementById("alphaShell").classList.add("show");
  setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),100);
}

function closeAlpha(){
  document.getElementById("alphaShell").classList.remove("show");
  activeAlpha?.blur();
  activeAlpha=null;
}

function insertAlpha(text){
  if(!activeAlpha)return;
  const value = alphaCaps ? text.toUpperCase() : text.toLowerCase();
  const start=activeAlpha.selectionStart??activeAlpha.value.length;
  const end=activeAlpha.selectionEnd??start;
  activeAlpha.value=activeAlpha.value.slice(0,start)+value+activeAlpha.value.slice(end);
  const pos=start+value.length;
  activeAlpha.setSelectionRange(pos,pos);
  updateFromCell(activeAlpha);
}

function alphaBackspace(){
  if(!activeAlpha)return;
  let start=activeAlpha.selectionStart??activeAlpha.value.length;
  let end=activeAlpha.selectionEnd??start;
  if(start===end && start>0)start--;
  activeAlpha.value=activeAlpha.value.slice(0,start)+activeAlpha.value.slice(end);
  activeAlpha.setSelectionRange(start,start);
  updateFromCell(activeAlpha);
}

document.querySelectorAll("#alphaShell [data-letter]").forEach(btn=>{
  btn.addEventListener("click",()=>insertAlpha(btn.dataset.letter));
});
document.querySelectorAll("#alphaShell [data-action-alpha]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const action=btn.dataset.actionAlpha;
    if(action==="back") alphaBackspace();
    else if(action==="caps"){
      alphaCaps=!alphaCaps;
      btn.textContent=alphaCaps?"⇧":"⇩";
    }
    else if(action==="hide") closeAlpha();
    else if(action==="next"){
      if(activeAlpha) nextField(activeAlpha);
    }
  });
});

function openDate(){
  const input=$("#date");
  if(typeof input.showPicker==="function"){try{input.showPicker();return}catch(e){}}
  input.style.position="fixed";input.style.left="50%";input.style.top="30%";input.style.width="1px";input.style.height="1px";input.style.opacity=".01";input.style.pointerEvents="auto";input.tabIndex=0;input.focus();input.click();
  setTimeout(()=>{input.style.position="absolute";input.style.pointerEvents="none";input.tabIndex=-1},300);
}
function openSearch(){$("#searchModal").classList.add("open");$("#searchInput").value="";renderSearch("")}
function renderSearch(q){
  const box=$("#results");box.innerHTML="";
  const list=app.notes.filter(n=>(n.client||"").toLowerCase().includes(q.toLowerCase()));
  if(!list.length){box.innerHTML='<div style="padding:18px;color:#71806c">No se encontraron notas.</div>';return}
  list.forEach(n=>{
    const b=document.createElement("button");b.className="result";
    b.innerHTML=`<strong>${n.client||"Cliente sin nombre"}</strong><span><em>${folio(n.folio)}</em><b>${money(noteTotal(n))}</b></span>`;
    b.onclick=()=>{app.active=n.id;save();render();$("#searchModal").classList.remove("open")};
    box.appendChild(b);
  });
}

$("#dateTap").onclick=openDate;
$("#date").oninput=e=>{current().date=e.target.value;showDate(e.target.value);save()};
$("#client").oninput=e=>{current().client=e.target.value;save()};
$("#client").onfocus=e=>showTextTools(e.target);
$("#client").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-row="0"][data-key="q"]').focus()}};

["newTop","newBottom"].forEach(id=>$("#"+id).onclick=()=>newNote(true));
["searchTop","searchBottom"].forEach(id=>$("#"+id).onclick=openSearch);
["printTop","printBottom"].forEach(id=>$("#"+id).onclick=()=>window.print());
["deleteTop","deleteBottom"].forEach(id=>$("#"+id).onclick=deleteNote);
$("#hideBottom").onclick=()=>{closeNumeric();closeAlpha();hideTextTools();document.activeElement?.blur()};

$("#searchInput").oninput=e=>renderSearch(e.target.value);
$("#closeSearch").onclick=()=>$("#searchModal").classList.remove("open");

document.querySelectorAll(".keypad button").forEach(b=>{
  b.onclick=()=>{
    const k=b.dataset.k,a=b.dataset.action;
    if(k!=null)insertKey(k);
    else if(a==="back")backspace();
    else if(a==="clear")clearField();
    else if(a==="wipe"){clearField()}
    else if(a==="left")moveCaret(-1);
    else if(a==="right")moveCaret(1);
    else if(a==="enter"||a==="next"){if(activeNumeric)nextField(activeNumeric)}
  }
});
$("#hideTextKb").onclick=()=>{document.activeElement?.blur();hideTextTools()};
$("#nextTextKb").onclick=()=>{const el=window._textActive;if(el)nextField(el)};

load();
</script>
</body>
</html>
